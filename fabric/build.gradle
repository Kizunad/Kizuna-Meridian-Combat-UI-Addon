plugins { id 'net.fabricmc.fabric-loom' }
description = '客户端架势与命令、服务端施放和已学列表同步。'
repositories { maven { url = 'https://maven.fabricmc.net/' } }

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation project(':core')
    implementation 'dev.kizuna.meridian.technique:server'
    // 直接使用 Framework server 的身体协议与服务端 API，按 settings 中的本地替换键解析到组合工程。
    implementation 'local.meridian:server'
    // 功法库与 /meridian 注册点（Framework fabric）以源码组合，依赖处写替换坐标；GameTest 不走完整装配也要在运行时装入。
    implementation 'dev.kizuna.meridian.technique:fabric'
    implementation 'dev.kizuna.meridian:fabric'
    include project(':core')
    include project(':shared')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    testImplementation libs.junit4
}
test { useJUnit() }
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

loom {
    mods { meridian_combat { sourceSet sourceSets.main } }
    runs {
        client { runDir 'build/playtest' }
        server { runDir 'build/server' }
    }
}
sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
dependencies {
    // 登录假玩家与记录连接夹具来自功法库的 testFixtures，与功法 fabric 同经源码组合解析。
    gametestImplementation testFixtures('dev.kizuna.meridian.technique:fabric')
}
loom {
    mods {
        meridian_combat_test { sourceSet sourceSets.gametest }
        meridian_combat_client_test { sourceSet sourceSets.clientTest }
    }
    runs {
        clientTest {
            client()
            source sourceSets.clientTest
            runDir 'build/clienttest'
            programArgs '--quickPlaySingleplayer', 'combat-hud-test', '--width', '1280', '--height', '960'
        }
        gametest {
            server()
            name '战斗输入 GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

// HUD 截图使用完整安装环境；服务端契约测试仍使用其独立测试宿主。
if (providers.gradleProperty('combatFullAssembly').isPresent()) {
    apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
    dependencies {
        // Human 在本仓之上，只在运行时需要，按装配清单读文件。
        localRuntime files(kizunaWorkspace.artifact('human', 'client', false))
    }
}
tasks.named('runGametest') {
    doFirst {
        // 每局从空目录新建世界：GameTest 服务端按自带的平坦预设建世界，旧目录只会累积上一局的区块、实体、假玩家与模组存档。
        // 26.2 把生成设置与游戏规则拆到了 data/minecraft，只留 level.dat 会退回随机种子的默认地形，所以整个目录删掉。
        file('build/gametest/world').deleteDir()
    }
}

tasks.register('prepareClientTestWorld', Copy) {
    from layout.buildDirectory.dir('gametest/world')
    into layout.buildDirectory.dir('clienttest/saves/combat-hud-test')
    exclude 'session.lock'
}
tasks.named('runClientTest') {
    dependsOn tasks.named('prepareClientTestWorld')
    def report = layout.buildDirectory.file('clienttest-results.txt')
    def options = layout.buildDirectory.file('clienttest/options.txt')
    doFirst {
        if (!providers.gradleProperty('combatFullAssembly').isPresent()) {
            throw new GradleException('HUD 客户端截图需要 -PcombatFullAssembly 完整装配')
        }
        report.get().asFile.text = 'success=false\n'
        // 26.2 首启先弹无障碍引导页再进快速游戏，测试目录预置为已看过引导。
        def file = options.get().asFile
        if (file.exists()) {
            file.text = file.text.replace('onboardAccessibility:true', 'onboardAccessibility:false')
        } else {
            file.parentFile.mkdirs()
            file.text = 'onboardAccessibility:false\n'
        }
    }
    doLast {
        if (!report.get().asFile.text.startsWith('success=true')) {
            throw new GradleException("HUD 客户端验收失败：${report.get().asFile}")
        }
    }
}

plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.combat'
    version = '0.1.1-SNAPSHOT'
}
subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}
tasks.named('assemble') { dependsOn ':shared:assemble', ':core:assemble', ':fabric:assemble' }
tasks.named('check') { dependsOn ':shared:check', ':core:check', ':fabric:check', 'checkDocs' }
tasks.register('test') {
    group = 'verification'
    dependsOn ':shared:test', ':core:test', ':fabric:test'
}
tasks.register('checkDocs', Exec) {
    group = 'verification'
    commandLine 'python3', 'scripts/check_docs.py'
}

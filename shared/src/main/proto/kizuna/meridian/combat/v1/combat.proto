syntax = "proto3";
package kizuna.meridian.combat.v1;
option java_package = "dev.kizuna.meridian.combat.protocol.pb";
option java_outer_classname = "CombatMessages";

// 客户端只能提交功法标识、水平输入方向和连接内按压序号；不携带费用或身体身份。
message TechniquePress {
  string technique_id = 1;
  float move_x = 2;
  float move_z = 3;
  // 普通式为 0；守式使用 1..2147483647 的严格递增序号，同一连接内不复用。
  uint32 press_id = 4;
  uint32 practice_press_id = 5; // 普通槽按运功式时的连接内递增序号，与 G 独立
  string end_practice_id = 6; // 客户端最近收到的本次运功身份；空表示请求起式
}
// 松开只引用同一连接的一次按压，身体和施放身份由服务端映射。
message TechniqueRelease { uint32 press_id = 1; }
// 登录、已学变化和状态刷新时同步完整投影，空列表同样具有覆盖语义。
message KnownTechniques { repeated KnownTechnique techniques = 1; }
message KnownTechnique {
  string id = 1;
  string name = 2;
  string icon_id = 3;
  // 4 原为发包时刻的冷却剩余毫秒：剩余量每次刷新都变，冷却期间整份列表会被反复重发，改发结束时刻后停用。
  reserved 4;
  reserved "cooldown_remaining_millis";
  int64 cooldown_total_millis = 5; // 功法声明的冷却毫秒，只用来画冷却占比
  string unavailable_reason = 6;
  // 独立的简介与精确已学版本所属卷册；旧服务端省略时客户端展示空态。
  string description = 7;
  string volume_id = 8;
  string volume_name = 9;
  string book_name = 10;
  // 冷却结束时的世界总 tick（与客户端 level.getGameTime() 同一时基），0 表示不在冷却；客户端按自己的世界时间算剩余。
  int64 cooldown_end_tick = 11;
  // 功法书详情页逐行显示的明细：数值、境界、承接关系；这具身体绑得上时再加要用的经脉、筋肉、器官。
  // 只随目录和绑定结果变，冷却走动不改它。旧服务端省略时客户端只显示简介。
  repeated string details = 12;
  // 现在放不出来属于哪一类，图标右下角按它叠小图标；没有（或旧服务端没发）时为 BLOCK_NONE。
  // 真元、力气这两类会随时间自己恢复，图标只变灰不标红框。
  BlockKind block = 13;
  // 独立格挡键使用的守式，仍在知识列表中展示，但不能放入十槽。
  bool guard = 14;
  bool maintained_breathing = 15;
  string active_practice_id = 16; // 本式正在维持时同步实际施放身份
}
enum BlockKind {
  BLOCK_NONE = 0;
  BLOCK_BODY = 1; // 身体绑不上这一式：境界、经脉、筋骨伤残等
  BLOCK_QI = 2; // 真元不够付
  BLOCK_EXERTION = 3; // 筋肉或脏腑这会儿做不了这份功
  BLOCK_ITEM = 4; // 手里的东西不对：没拿这一式要的兵器，或没有弹药
  BLOCK_BUSY = 5; // 正在放别的式。服务端不发这一类，客户端照自己的施放状态副本在本地标
}
// 服务端解析 /meridian combat slot 后只发给执行者本人；槽位仍只写客户端本地文件，服务端不保存。
enum SlotOperation {
  SLOT_OPERATION_UNSPECIFIED = 0;
  SLOT_OPERATION_SET = 1;
  SLOT_OPERATION_CLEAR = 2;
  SLOT_OPERATION_LIST = 3;
}
message SlotCommand {
  SlotOperation operation = 1;
  int32 slot = 2;
  string technique_id = 3;
}
